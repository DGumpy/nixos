# Put a picture of choice here. Default is the current wallpaper
image {
    monitor = eDP-1
    path = /home/dgumption/Pictures/papes/space.png
    size = 230
    rounding = -1
    border_size = 2
    border_color = rgb(89b4fa)
    rotate = 0
    reload_time = -1
    position = 0, 300
    halign = center
    valign = bottom
}
